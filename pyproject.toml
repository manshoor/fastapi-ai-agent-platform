[project]
name = "fastapi-crud"
version = "0.1.0"
description = "Owner-scoped async CRUD with PostgreSQL and bounded Redis caching"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "redis>=5,<8",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.10,<3",
  "email-validator>=2,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
  "anyio>=4,<5",
  "aiokafka==0.15.0",
  "openai==3.42.0",
  "opentelemetry-sdk==1.38.0",
  "opentelemetry-exporter-otlp-proto-http==1.38.0",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "httpx>=0.28,<1",
  "asgi-lifespan>=2,<3",
  "ruff>=0.11,<1",
  "locust>=2.34,<3",
  "langsmith>=0.4.25,<1",
  "pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
