# Private local receivers only. These are not hosted Langfuse/LangSmith UI integrations.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 2097152

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 96
    spike_limit_mib: 24
  transform/langfuse:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.namespace"])
      - context: span
        statements:
          - keep_keys(attributes, ["job_id", "event_id", "item_id", "attempt", "lease_generation", "model", "prompt_version", "schema_version", "status", "outcome", "error_code", "provider", "operation", "topic", "partition", "offset", "queue_depth", "input_tokens", "output_tokens", "duration_ms", "gen_ai.system", "gen_ai.operation.name", "gen_ai.request.model", "gen_ai.response.model", "gen_ai.usage.input_tokens", "gen_ai.usage.output_tokens", "messaging.system", "messaging.destination.name", "messaging.operation.name", "document_id", "query_id", "chunk_count", "page_count", "retrieved_count", "top_k", "turn_id", "action_id", "model_calls", "tool_calls", "node_count", "edge_count", "graph_dropped", "graph_passages"])
          - set(attributes["langfuse.observation.type"], "span")
          - set(attributes["langfuse.observation.type"], "generation") where attributes["gen_ai.system"] != nil
          - set(attributes["langfuse.observation.type"], "embedding") where attributes["gen_ai.operation.name"] == "embeddings"
          - set(attributes["langfuse.observation.type"], "retriever") where name == "rag.retrieve"
          - set(attributes["langfuse.observation.type"], "chain") where name == "rag.query"
          - set(attributes["langfuse.observation.type"], "agent") where name == "assistant.turn"
          - set(attributes["langfuse.observation.type"], "tool") where name == "assistant.tool"
          - set(status.message, "")
      - context: spanevent
        statements:
          - keep_keys(attributes, ["error_code", "outcome"])
  transform/langsmith:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.namespace"])
      - context: span
        statements:
          - keep_keys(attributes, ["job_id", "event_id", "item_id", "attempt", "lease_generation", "model", "prompt_version", "schema_version", "status", "outcome", "error_code", "provider", "operation", "topic", "partition", "offset", "queue_depth", "input_tokens", "output_tokens", "duration_ms", "gen_ai.system", "gen_ai.operation.name", "gen_ai.request.model", "gen_ai.response.model", "gen_ai.usage.input_tokens", "gen_ai.usage.output_tokens", "messaging.system", "messaging.destination.name", "messaging.operation.name", "document_id", "query_id", "chunk_count", "page_count", "retrieved_count", "top_k", "turn_id", "action_id", "model_calls", "tool_calls", "node_count", "edge_count", "graph_dropped", "graph_passages"])
          - set(attributes["langsmith.span.kind"], "chain")
          - set(attributes["langsmith.span.kind"], "llm") where attributes["gen_ai.system"] != nil
          - set(attributes["langsmith.span.kind"], "embedding") where attributes["gen_ai.operation.name"] == "embeddings"
          - set(attributes["langsmith.span.kind"], "retriever") where name == "rag.retrieve"
          - set(attributes["langsmith.span.kind"], "tool") where name == "assistant.tool"
          - set(attributes["langsmith.metadata.model"], attributes["model"]) where attributes["model"] != nil
          - set(attributes["langsmith.metadata.prompt_version"], attributes["prompt_version"]) where attributes["prompt_version"] != nil
          - set(attributes["langsmith.metadata.schema_version"], attributes["schema_version"]) where attributes["schema_version"] != nil
          - set(status.message, "")
      - context: spanevent
        statements:
          - keep_keys(attributes, ["error_code", "outcome"])
  batch/langfuse:
    timeout: 200ms
    send_batch_size: 64
    send_batch_max_size: 128
  batch/langsmith:
    timeout: 200ms
    send_batch_size: 64
    send_batch_max_size: 128
  batch/metrics:
    timeout: 200ms
    send_batch_size: 64
    send_batch_max_size: 128

exporters:
  otlphttp/langfuse:
    endpoint: http://otlp:4318/langfuse
    timeout: 2s
    compression: gzip
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 2s
      max_elapsed_time: 5s
    sending_queue:
      enabled: true
      queue_size: 128
      num_consumers: 1
  otlphttp/langsmith:
    endpoint: http://otlp:4318/langsmith
    timeout: 2s
    compression: gzip
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 2s
      max_elapsed_time: 5s
    sending_queue:
      enabled: true
      queue_size: 128
      num_consumers: 1
  otlphttp/metrics:
    endpoint: http://otlp:4318/direct
    timeout: 2s
    compression: gzip
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 2s
      max_elapsed_time: 5s
    sending_queue:
      enabled: true
      queue_size: 128
      num_consumers: 1

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: error
  pipelines:
    traces/langfuse:
      receivers: [otlp]
      processors: [memory_limiter, transform/langfuse, batch/langfuse]
      exporters: [otlphttp/langfuse]
    traces/langsmith:
      receivers: [otlp]
      processors: [memory_limiter, transform/langsmith, batch/langsmith]
      exporters: [otlphttp/langsmith]
    metrics/local:
      receivers: [otlp]
      processors: [memory_limiter, batch/metrics]
      exporters: [otlphttp/metrics]
