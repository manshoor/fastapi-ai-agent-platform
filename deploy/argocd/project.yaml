# What git may deliver: these six kinds, from this repository, into one namespace.
# No Secret, so git cannot deliver one.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: fastapi-demo
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/manshoor/fastapi-ai-agent-platform.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: fastapi-demo
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: batch
      kind: Job
    - group: networking.k8s.io
      kind: NetworkPolicy
