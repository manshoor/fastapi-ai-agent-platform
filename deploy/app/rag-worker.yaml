apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-worker
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  # Never two at once: the connection budget counts one.
  strategy:
    type: Recreate
  # It gives Kafka up to 15 s to start, then exits: only a later one counts as running.
  minReadySeconds: 20
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-worker
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 50
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        # No liveness probe: a Kafka outage must not restart-loop it.
        - name: rag-worker
          image: app
          command: ["python", "-m", "app.rag.worker"]
          envFrom:
            - configMapRef:
                name: database-settings
            - configMapRef:
                name: ai-settings
            - configMapRef:
                name: provider-settings
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: DB_POOL_SIZE
              value: "4"
            # Not a secret: the simulator takes any key.
            - name: OPENAI_API_KEY
              value: local-simulator-only-not-a-real-key
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # Address-space caps, not use: two parser children (AI_CONCURRENCY) of 1 GiB,
              # each with one 256 MiB OCR tool at a time, plus the worker.
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
