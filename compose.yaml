x-app-environment: &app-environment
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: app
  DB_USER: app
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py to create POSTGRES_PASSWORD}
  DATABASE_URL: ${DATABASE_URL:-}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?Run scripts/init_env.py to create JWT_SECRET}
  AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-900}

x-runtime-build: &runtime-build
  context: .
  target: runtime

services:
  db:
    image: postgres:19rc1-bookworm
    ports:
      - "127.0.0.1:5433:5432"
    command: ["postgres", "-c", "max_connections=100"]
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py to create POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  redis:
    image: redis:7.4
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "no"
      - --save
      - ""
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 2s
      timeout: 2s
      retries: 15

  migrate:
    build: *runtime-build
    environment: *app-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: *runtime-build
    environment: *app-environment
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).close()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    stop_grace_period: 20s

  tools:
    profiles: ["tools"]
    build:
      context: .
      target: test
    environment: *app-environment
    user: "${HOST_UID:?Run scripts/init_env.py to create HOST_UID}:${HOST_GID:?Run scripts/init_env.py to create HOST_GID}"
    volumes:
      - type: bind
        source: ./artifacts
        target: /artifacts
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

volumes:
  postgres_data:
