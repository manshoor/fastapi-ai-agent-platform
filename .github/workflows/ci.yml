# Lint, the PostgreSQL/Redis suite with a schema drift check, the
# Kafka/provider-simulator/collector suite, and image build, smoke and publish.
# No stored secrets are used: credentials are literal test-only values from the
# compose files, per-run random values, or the run's own token (publish only).
#
#   lint  test  ai-qa  image (amd64, arm64) --archives--> publish-check (PR only)
#     \     |     |     /
#      +--- publish ---+   main pushes only: GHCR plus a signed build record
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A main run may be publishing: let it finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv python install 3.13
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE: docker compose --env-file /dev/null -p fastapi-qa -f compose.test.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run suite
        run: $COMPOSE run --build --rm tests
      # Fails when app/models.py and migrations/ disagree.
      - name: Check schema drift
        run: $COMPOSE run --rm tests alembic check
      - name: Show service logs
        if: failure()
        run: $COMPOSE logs --no-color
      - name: Stop services
        if: always()
        run: $COMPOSE down --volumes --remove-orphans

  ai-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE: docker compose --env-file /dev/null -p fastapi-ai-qa -f compose.ai.test.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run suite
        run: $COMPOSE run --build --rm tests
      - name: Show service logs
        if: failure()
        run: $COMPOSE logs --no-color
      - name: Stop services
        if: always()
        run: $COMPOSE down --volumes --remove-orphans

  # Builds without a shared cache, smoke-tests the images, and saves those exact bytes.
  image:
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    env:
      APP_IMAGE: fastapi-ai-agent-platform:ci
      POSTGRES_IMAGE: fastapi-ai-agent-platform-postgres:ci
      SIMULATOR_IMAGE: fastapi-ai-agent-platform-simulator:ci
      # One plain manifest per image, not an index with a provenance entry.
      BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
      COMPOSE: docker compose --env-file /dev/null -p fastapi-image -f compose.yaml -f compose.image.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - run: uv python install 3.13
      - run: uv sync --locked
      - name: Build images
        run: |
          labels=(
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            --label "org.opencontainers.image.revision=$GITHUB_SHA"
          )
          docker build --pull "${labels[@]}" --target runtime --tag "$APP_IMAGE" .
          docker build --pull "${labels[@]}" --target simulator --tag "$SIMULATOR_IMAGE" .
          docker build --pull "${labels[@]}" --tag "$POSTGRES_IMAGE" docker/postgres
      - name: Import every entry point
        run: |
          docker run --rm --network none "$APP_IMAGE" python -c '
          import app.main
          import app.ai.dispatcher, app.rag.sinks
          import app.ai.worker, app.rag.worker, app.rag.sqs_worker
          import app.rag.connectors.__main__
          '
      - name: Create throwaway credentials
        run: |
          for name in POSTGRES_PASSWORD JWT_SECRET; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Smoke-test the app and PostgreSQL images
        run: |
          $COMPOSE up --detach --wait api
          uv run --locked python scripts/smoke.py
      - name: Show service logs
        if: failure()
        run: $COMPOSE logs --no-color
      - name: Stop services
        if: always()
        run: $COMPOSE down --volumes --remove-orphans
      - name: Check the simulator image
        run: |
          files=$(docker run --rm "$SIMULATOR_IMAGE" find tests -type f)
          test "$files" = tests/support/provider_simulator.py
          docker run --detach --rm --name simulator --publish 127.0.0.1:8080:8080 "$SIMULATOR_IMAGE"
          curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:8080/health/live
          docker stop simulator
      - name: Save the tested images
        run: docker save --output "images-${{ matrix.arch }}.tar" "$APP_IMAGE" "$POSTGRES_IMAGE" "$SIMULATOR_IMAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-${{ matrix.arch }}
          path: images-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
          # A re-run of this job replaces its earlier archive.
          overwrite: true

  # Runs the publish script against a throwaway registry, then pulls both platforms.
  publish-check:
    if: github.event_name == 'pull_request'
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REGISTRY: localhost:5000/manshoor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: images-*
          path: archives
          merge-multiple: true
      - name: Start a throwaway registry
        run: |
          docker run --detach --name registry --publish 127.0.0.1:5000:5000 \
            registry:3.1.1@sha256:325b4b29b041e82803abeb703e201655e4e23ab83264ec1a7c9ddb0a5b14a6e0
          curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-all-errors \
            http://localhost:5000/v2/
      # The throwaway registry takes any login: this tests the login command itself.
      - name: Log in to the throwaway registry
        run: printf '%s' unused | skopeo login --tls-verify=false --username ci --password-stdin localhost:5000
      - name: Publish to the throwaway registry
        id: publish
        run: .github/scripts/publish_images.sh "$REGISTRY" "$GITHUB_SHA" archives >> "$GITHUB_OUTPUT"
      - name: Pull both platforms by digest
        env:
          APP: fastapi-ai-agent-platform@${{ steps.publish.outputs.app }}
          POSTGRES: fastapi-ai-agent-platform-postgres@${{ steps.publish.outputs.postgres }}
          SIMULATOR: fastapi-ai-agent-platform-simulator@${{ steps.publish.outputs.simulator }}
        run: |
          for image in "$APP" "$POSTGRES" "$SIMULATOR"; do
            for arch in amd64 arm64; do
              docker pull --quiet --platform "linux/$arch" "$REGISTRY/$image"
              test "$(docker image inspect --format '{{.Architecture}}' "$REGISTRY/$image")" = "$arch"
            done
          done
      - name: Stop the registry
        if: always()
        run: docker rm --force --volumes registry

  # The only job with write permissions. It moves the tested bytes to GHCR and signs a
  # record of their digests; it never builds an image or runs application code.
  publish:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && github.repository == 'manshoor/fastapi-ai-agent-platform'
    needs: [lint, test, ai-qa, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # packages for GHCR; the last three are the actions/attest README's list.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      REGISTRY: ghcr.io/manshoor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: images-*
          path: archives
          merge-multiple: true
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
      - name: Publish
        id: publish
        run: .github/scripts/publish_images.sh "$REGISTRY" "$GITHUB_SHA" archives >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/manshoor/fastapi-ai-agent-platform
          subject-digest: ${{ steps.publish.outputs.app }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/manshoor/fastapi-ai-agent-platform-postgres
          subject-digest: ${{ steps.publish.outputs.postgres }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/manshoor/fastapi-ai-agent-platform-simulator
          subject-digest: ${{ steps.publish.outputs.simulator }}
