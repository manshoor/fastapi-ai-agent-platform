# Checks deploy/ and proves it in a throwaway kind cluster on the runner. No stored
# secrets, no write access, nothing deployed anywhere else.
#
#   manifests: render -> check_deploy.py -> promote_images.py verify
#   cluster:   kind + Argo CD at the PR head -> smoke_gitops.py -> delete
name: GitOps

on:
  push:
    branches: [main]
    paths: &paths
      - deploy/**
      - scripts/check_deploy.py
      - scripts/gitops_cluster.py
      - scripts/promote_images.py
      - scripts/smoke.py
      - scripts/smoke_gitops.py
      - .github/workflows/gitops.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitops-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # v1.36.4, the version of the kind node.
  KUBECTL_URL: https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl
  KUBECTL_SHA256: 8b8f088da2dab964f853b38464033b1be15ede2839eca751482357c45abdd05a
  KIND_URL: https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
  KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d

jobs:
  manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The whole history: the pins are checked against commit order.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv python install 3.13
      - run: uv sync --locked
      - &install-kubectl
        name: Install kubectl
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/bin/kubectl" "$KUBECTL_URL"
          echo "$KUBECTL_SHA256  $RUNNER_TEMP/bin/kubectl" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bin/kubectl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Render
        run: kubectl kustomize deploy/app > "$RUNNER_TEMP/app.yaml"
      - name: Check the manifests
        run: uv run --locked python scripts/check_deploy.py < "$RUNNER_TEMP/app.yaml"
      - name: Verify the image pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python scripts/promote_images.py verify

  cluster:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv python install 3.13
      - run: uv sync --locked
      - *install-kubectl
      - name: Install kind
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/bin/kind" "$KIND_URL"
          echo "$KIND_SHA256  $RUNNER_TEMP/bin/kind" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bin/kind"
      - name: Start the cluster
        run: uv run --locked python scripts/gitops_cluster.py up --revision "$REVISION"
      - name: Smoke-test the cluster
        run: uv run --locked python scripts/smoke_gitops.py --revision "$REVISION"
      # Never Secrets.
      - name: Show pods, events and logs
        if: failure()
        run: |
          kube=(kubectl --context kind-fastapi-gitops)
          "${kube[@]}" get pods --all-namespaces --output wide || true
          "${kube[@]}" --namespace argocd get application fastapi-demo --output yaml || true
          "${kube[@]}" --namespace fastapi-demo get deployments,statefulsets,jobs,services,persistentvolumeclaims --output wide || true
          "${kube[@]}" --namespace fastapi-demo describe pods || true
          "${kube[@]}" get events --all-namespaces --sort-by .lastTimestamp || true
          for name in db redis migrate api; do
            "${kube[@]}" --namespace fastapi-demo logs --selector "app.kubernetes.io/name=$name" --all-containers --prefix --tail 100 || true
          done
          for name in argocd-application-controller argocd-repo-server; do
            "${kube[@]}" --namespace argocd logs --selector "app.kubernetes.io/name=$name" --all-containers --prefix --tail 200 || true
          done
      - name: Delete the cluster
        if: always()
        run: uv run --locked python scripts/gitops_cluster.py down
