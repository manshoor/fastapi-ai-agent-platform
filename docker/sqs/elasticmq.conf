# Local SQS (ElasticMQ) for document events. FIFO queues: per-document order by
# MessageGroupId, deduplication by MessageDeduplicationId. No redrive policy: only
# malformed messages are sent to the DLQ queue, explicitly, by the SQS worker.
include classpath("application.conf")

node-address {
  protocol = http
  host = sqs
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = false
}

queues {
  "rag-document-events.fifo" {
    fifo = true
    contentBasedDeduplication = false
    defaultVisibilityTimeout = 180 seconds
  }
  "rag-document-events-dlq.fifo" {
    fifo = true
    contentBasedDeduplication = false
  }
}
