# TLS edge for the API (compose.edge.yaml): nginx terminates TLS 1.2 and 1.3 on 8443,
# limits each client address, and proxies to the API over the private edge network.
#
#   client --HTTPS--> edge:8443 --HTTP--> api:8000
#                     per address: request rates and 20 connections  -> 429
#                     bodies over 32 KiB (document uploads: 6 MiB)    -> 413
#                     eval and demo-setup routes                      -> 404
#
# Replies nginx makes without asking the API carry X-Edge-Reply: 1.
# Through Docker's port proxy every host client may arrive from one gateway address;
# then the per-address limits act as global caps (scripts/smoke_edge.py shows which).
# The access log keeps address, method, path, status, timing and the API's status:
# never headers or query strings. The error log keeps only critical failures, because
# nginx writes the request line, Host and Referer into every error line.

user nginx;
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr crit;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    # nginx's own replies (404, 413, 429, 502, 504) are JSON, like the API's.
    default_type application/json;

    # The container healthcheck from 127.0.0.1 is not logged. "-" as the API status
    # means nginx answered by itself.
    map $remote_addr $loggable {
        127.0.0.1 0;
        default 1;
    }
    log_format edge '$remote_addr [$time_iso8601] "$request_method $uri" $status '
                    '$body_bytes_sent $request_time $upstream_status';
    access_log /dev/stdout edge if=$loggable;

    # Request rates per client address; past rate plus burst -> 429. Only POSTs count
    # toward rag: uploads and queries cost model calls, status reads do not.
    map $request_method $rag_key {
        POST $binary_remote_addr;
        default "";
    }
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=assistant:10m rate=20r/m;
    limit_req_zone $rag_key zone=rag:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_status 429;

    # Open connections per client address.
    limit_conn_zone $binary_remote_addr zone=connections:10m;
    limit_conn connections 20;
    limit_conn_status 429;

    # Slow or large requests stop here, before the API.
    client_header_timeout 10s;
    client_body_timeout 10s;
    client_max_body_size 32k;
    send_timeout 30s;
    keepalive_timeout 30s;

    # Docker's DNS, asked again so a recreated API container is found.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream api_backend {
        zone api_backend 64k;
        server api:8000 resolve;
        keepalive 16;
        # Under uvicorn's keep-alive (2 s in the image, 5 s by default): nginx never
        # reuses a connection uvicorn is closing.
        keepalive_timeout 1s;
    }

    # API responses get a content policy that loads nothing; the interactive docs keep
    # their own.
    map $uri $content_policy {
        ~^/api/ "default-src 'none'; frame-ancestors 'none'";
        default "";
    }

    # Set only when nginx answered without the API: limits, sizes, blocked routes.
    map $upstream_addr $edge_reply {
        "" 1;
        default "";
    }

    server {
        listen 8443 ssl;

        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        # TLS 1.2 suites for the P-256 certificate; TLS 1.3 uses OpenSSL's defaults.
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:TLS:1m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # On every response, errors included. No HSTS: on localhost it would force HTTPS
        # on every local site.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy $content_policy always;
        add_header X-Edge-Reply $edge_reply always;

        # The client's address replaces any X-Forwarded-For it sent. The API trusts no
        # forwarded header; redirects it builds get the https scheme back here.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect http:// https://;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # nginx's own errors; the API's error responses pass through unchanged.
        error_page 413 @too_large;
        error_page 429 @too_many;
        error_page 502 @unreachable;
        error_page 504 @too_slow;

        location @too_large {
            return 413 '{"detail":"Request body too large"}';
        }

        location @too_many {
            return 429 '{"detail":"Too many requests"}';
        }

        location @unreachable {
            return 502 '{"detail":"API unreachable"}';
        }

        location @too_slow {
            return 504 '{"detail":"API did not answer in time"}';
        }

        # Eval-only and demo-setup routes stay inside the private stack.
        location ^~ /api/v1/rag/query/diagnostics {
            return 404 '{"detail":"Not Found"}';
        }

        location ^~ /api/v1/residence/demo {
            return 404 '{"detail":"Not Found"}';
        }

        # Prefix locations, never exact ones: the API also routes a path with a trailing
        # newline (%0A), which an exact match would send to the general zone.

        # Passwords and authenticator codes.
        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://api_backend;
        }

        location /api/v1/assistant/totp/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://api_backend;
        }

        # Model calls: a turn may run its 120 s deadline plus a 15 s backstop. Raise the
        # timeout with ASSISTANT_TURN_DEADLINE_SECONDS.
        location /api/v1/assistant/messages {
            limit_req zone=assistant burst=10 nodelay;
            proxy_read_timeout 150s;
            proxy_pass http://api_backend;
        }

        location ~ ^/api/v1/assistant/actions/[^/]+/confirm$ {
            limit_req zone=assistant burst=10 nodelay;
            proxy_pass http://api_backend;
        }

        # Uploads: the API's 5 MiB file ceiling plus form overhead. Raise the size with
        # RAG_PDF_MAX_BYTES or RAG_TEXT_MAX_BYTES.
        location /api/v1/rag/documents {
            limit_req zone=rag burst=10 nodelay;
            limit_req zone=api burst=40 nodelay;
            client_max_body_size 6m;
            client_body_timeout 30s;
            proxy_pass http://api_backend;
        }

        # Raise the timeout with RAG_QUERY_DEADLINE_SECONDS.
        location /api/v1/rag/query {
            limit_req zone=rag burst=10 nodelay;
            limit_req zone=api burst=40 nodelay;
            proxy_read_timeout 150s;
            proxy_pass http://api_backend;
        }

        location /api/v1/rag/ {
            limit_req zone=rag burst=10 nodelay;
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://api_backend;
        }

        location / {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://api_backend;
        }
    }
}
